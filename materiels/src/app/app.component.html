<div class="container">
  <h1>{{ title }}</h1>

  <form [formGroup]="materielForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nom">Nom du Matériel</label>
      <input id="nom" formControlName="nom" type="text" placeholder="Nom du matériel" />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <input id="description" formControlName="description" type="text" placeholder="Description" />
    </div>

    <div class="form-group">
      <label for="serviceDat">Date de Mise en Service</label>
      <input id="serviceDat" formControlName="serviceDat" type="date" />
    </div>

    <div class="form-group">
      <label for="endGarantee">Date de Fin de Garantie</label>
      <input id="endGarantee" formControlName="endGarantee" type="date" />
    </div>

    <div class="button-group">
      <button type="submit" [disabled]="materielForm.invalid" *ngIf="!isEditing">Créer</button>
      <button type="submit" [disabled]="materielForm.invalid" *ngIf="isEditing">Mettre à jour</button>
      <button type="button" (click)="resetForm()">Annuler</button>
    </div>
  </form>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Description</th>
        <th>Date de Mise en Service</th>
        <th>Date de Fin de Garantie</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let materiel of materiels">
        <td>{{ materiel.id }}</td>
        <td>{{ materiel.nom }}</td>
        <td>{{ materiel.description }}</td>
        <td>{{ materiel.serviceDat | date: 'dd/MM/yyyy' }}</td>
        <td>{{ materiel.endGarantee | date: 'dd/MM/yyyy' }}</td>
        <td>
          <div class="action-buttons">
            <button (click)="onEdit(materiel)">Modifier</button>
            <button (click)="onDelete(materiel.id)" class="delete-button">Supprimer</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Correction potentielle pour s'assurer que isEditing est bien pris en compte -->
<script>
  console.log('Valeur de isEditing:', isEditing);
</script>
